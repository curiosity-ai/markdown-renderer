variables:
  project:  './src/MarkdownRenderer.Markdown/MarkdownRenderer.Markdown.csproj'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
# Pushing to an external feed through an API-key service connection needs NuGet 7.6 or later; the @0 task's
# default installs 7.0 and the push fails with "External service connections that use API key authentication
# require NuGet 7.6 or later".
- task: NuGetToolInstaller@1
  displayName: 'Use NuGet >= 7.6'
  inputs:
    versionSpec: '>=7.6.0'
    checkLatest: true


- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID) 
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: '$(project)'
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(project)'
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
  displayName: 'push nuget'
